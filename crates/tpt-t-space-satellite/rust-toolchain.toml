[toolchain]
# This crate requires a nightly toolchain for `#![feature(portable_simd)]`
# (the SIMD-accelerated MEKF). It is excluded from the stable parent
# workspace (see the root Cargo.toml `exclude`) and is built in isolation
# by the dedicated `satellite-nightly` CI job.
channel = "nightly"
components = ["rustfmt", "clippy"]
